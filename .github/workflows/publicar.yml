# Publica o site no GitHub Pages a cada push na branch main,
# inclusive quando uma planilha nova é enviada pela interface do GitHub.
# Configuração única no GitHub: Settings > Pages > Source: "GitHub Actions".
#
# Atenção: o repositório é público, então este log também é. O conversor
# só imprime nomes de abas/colunas e contagens, nunca conteúdo de células.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch: # permite publicar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Não cancela uma publicação em andamento; a próxima espera na fila
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/configure-pages@v6

      - name: Instalar dependências
        run: |
          pip install -r scripts/requirements.txt
          npm ci

      # Se a planilha tiver problema, a publicação para aqui e o site continua na versão anterior
      - name: Converter e validar a planilha
        run: npm run dados

      - name: Gerar o site
        run: npm run build
        env:
          # Site em https://<usuario>.github.io/<repositorio>/
          # Com domínio próprio, remova esta linha.
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: 1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
